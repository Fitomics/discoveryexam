<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>RMR Deviation Chart</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
    }
    .controls {
      margin-bottom: 20px;
    }
    .controls label {
      margin-right: 10px;
    }
    .bar-container {
      display: flex;
      border: 2px solid #000;
      margin-top: 10px;
    }
    .segment {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 10px;
      position: relative;
    }
    .much-lower { background-color: #d67c62; }
    .lower      { background-color: #f9dead; }
    .exact      { background-color: #e0f0d8; }
    .higher     { background-color: #b3d59c; }
    .much-higher{ background-color: #6fa544; }
    .segment.highlight {
      outline: 4px solid #000;
    }
    .title {
      font-size: 1em;
      font-weight: bold;
      text-transform: uppercase;
    }
    .subtitle {
      margin-top: 5px;
      font-size: 0.8em;
      text-align: center;
    }
    #percentDiff {
      font-weight: bold;
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <div class="controls">
    <label>
      Measured RMR:
      <input type="number" id="measured" placeholder="e.g. 1500" />
    </label>
    <label>
      Predicted RMR:
      <input type="number" id="predicted" placeholder="e.g. 1800" />
    </label>
    <button id="calcBtn">Calculate</button>
  </div>

  <div id="percentDiff"></div>

  <div class="bar-container">
    <div id="seg0" class="segment much-lower">
      <span class="title">Much Lower</span>
      <span class="subtitle">31% or lower than predicted</span>
    </div>
    <div id="seg1" class="segment lower">
      <span class="title">Lower</span>
      <span class="subtitle">16–30% lower than predicted</span>
    </div>
    <div id="seg2" class="segment exact">
      <span class="title">±15%</span>
      <span class="subtitle">Within 15% of predicted</span>
    </div>
    <div id="seg3" class="segment higher">
      <span class="title">Higher</span>
      <span class="subtitle">16–30% higher than predicted</span>
    </div>
    <div id="seg4" class="segment much-higher">
      <span class="title">Much Higher</span>
      <span class="subtitle">31% or higher than predicted</span>
    </div>
  </div>

  <script>
    document.getElementById('calcBtn').addEventListener('click', function() {
      var m = parseFloat(document.getElementById('measured').value);
      var p = parseFloat(document.getElementById('predicted').value);
      if (isNaN(m) || isNaN(p) || p === 0) {
        alert('Please enter valid numbers for both Measured and Predicted RMR.');
        return;
      }
      var diff = ((m - p) / p) * 100;
      document.getElementById('percentDiff').textContent =
        'Difference: ' + diff.toFixed(1) + '%';
      
      var idx;
      if (diff <= -31)        idx = 0;
      else if (diff <= -16)   idx = 1;
      else if (diff <= 15)    idx = 2;
      else if (diff <= 30)    idx = 3;
      else                     idx = 4;

      for (var i = 0; i < 5; i++) {
        var seg = document.getElementById('seg' + i);
        if (i === idx) seg.classList.add('highlight');
        else           seg.classList.remove('highlight');
      }
    });
  </script>

</body>
</html>
