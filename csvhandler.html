<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSV Handler with jSpreadsheet</title>
  <link rel="stylesheet" href="reportstyles.css">
  <!-- jSpreadsheet & Jsuites -->
  <link rel="stylesheet" href="https://jspreadsheet.com/v7/jspreadsheet.css" />
  <link rel="stylesheet" href="https://jsuites.net/v5/jsuites.css" />
  <style>
    #drop-zone {
      border: 2px dashed #ccc;
      border-radius: 8px;
      padding: 25px;
      text-align: center;
      margin: 20px 0;
      background-color: #f9f9f9;
      cursor: pointer;
      transition: background-color 0.3s;
    }
    #drop-zone.dragover {
      background-color: #e9e9e9;
      border-color: #999;
    }
    .file-upload-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
    }
    .upload-btn {
      padding: 10px 20px;
      background-color: #4CAF50;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 16px;
    }
    .upload-btn:hover {
      background-color: #45a049;
    }
    /* Container for the editable spreadsheet */
    #spreadsheet {
      margin-top: 20px;
    }
    /* Style for edit controls */
    .controls {
      margin-top: 10px;
      display: flex;
      gap: 10px;
    }
    .control-btn {
      padding: 5px 10px;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    .control-btn:hover {
      background-color: #0069d9;
    }
    /* Add status message styling */
    #status-message {
      margin-top: 10px;
      padding: 10px;
      border-radius: 4px;
      display: none;
    }
    .success {
      background-color: #d4edda;
      color: #155724;
    }
    .error {
      background-color: #f8d7da;
      color: #721c24;
    }
  </style>
</head>
<body>
  <h1>CSV Handler</h1>
  <div class="container">
    <div class="csv-handler">
      <h2>CSV Handler</h2>
      <div class="file-upload-container">
        <div id="drop-zone">
          <p>Drop your CSV file here</p>
          <p>- or -</p>
          <p>Click to select a file</p>
        </div>
        <button class="upload-btn" id="upload-btn">Browse Files</button>
        <input type="file" id="file-input" accept=".csv" style="display:none;" />
      </div>
    </div>
  </div>

  <!-- Status message -->
  <div id="status-message"></div>

  <!-- Editable spreadsheet container -->
  <div id="spreadsheet"></div>
  
  <!-- Edit control buttons -->
  <div class="controls">
    <button id="add-row-btn" class="control-btn">Add Row</button>
    <button id="add-col-btn" class="control-btn">Add Column</button>
    <button id="delete-row-btn" class="control-btn">Delete Selected Row</button>
    <button id="delete-col-btn" class="control-btn">Delete Selected Column</button>
    <button id="save-csv-btn" class="control-btn">Save as CSV</button>
  </div>

  <!-- jSpreadsheet & Jsuites scripts -->
  <script src="https://jsuites.net/v5/jsuites.js"></script>
  <script src="https://jspreadsheet.com/v7/jspreadsheet.js"></script>
  <script>
    const dropZone = document.getElementById('drop-zone');
    const fileInput = document.getElementById('file-input');
    const uploadBtn = document.getElementById('upload-btn');
    const statusMessage = document.getElementById('status-message');
    
    // Store the sheet instance for later use
    let spreadsheet = null;

    // Helper function to show status messages
    function showStatus(message, isError = false) {
      statusMessage.textContent = message;
      statusMessage.style.display = 'block';
      
      if (isError) {
        statusMessage.className = 'error';
      } else {
        statusMessage.className = 'success';
      }
      
      // Hide after 3 seconds
      setTimeout(() => {
        statusMessage.style.display = 'none';
      }, 3000);
    }

    dropZone.addEventListener('click', () => fileInput.click());
    uploadBtn.addEventListener('click', () => fileInput.click());
    
    dropZone.addEventListener('dragover', e => { 
      e.preventDefault(); 
      dropZone.classList.add('dragover'); 
    });
    
    dropZone.addEventListener('dragleave', () => 
      dropZone.classList.remove('dragover')
    );
    
    dropZone.addEventListener('drop', e => {
      e.preventDefault();
      dropZone.classList.remove('dragover');
      handleFile(e.dataTransfer.files[0]);
    });
    
    fileInput.addEventListener('change', () => 
      handleFile(fileInput.files[0])
    );

    function handleFile(file) {
      if (!file) return;
      
      if (file.type !== 'text/csv' && !file.name.endsWith('.csv')) {
        showStatus('Please upload a CSV file.', true);
        return;
      }
      
      const reader = new FileReader();
      reader.onload = e => {
        try {
          renderSpreadsheet(e.target.result);
          showStatus('CSV file loaded successfully!');
        } catch (err) {
          console.error('Error parsing CSV:', err);
          showStatus('Error parsing CSV file. Please check the format.', true);
        }
      };
      reader.onerror = () => {
        showStatus('Error reading file.', true);
      };
      reader.readAsText(file);
    }

    function renderSpreadsheet(csvText) {
      const spreadsheetEl = document.getElementById('spreadsheet');
      
      // Clear existing spreadsheet if any
      if (spreadsheet) {
        spreadsheet.destroy();
        spreadsheetEl.innerHTML = '';
      }
      
      // Parse CSV into rows × columns (handle quotes and commas properly)
      let rows = parseCSV(csvText);
      
      if (!rows.length) {
        showStatus('CSV file appears to be empty.', true);
        return;
      }
      
      const headers = rows[0];
      const data = rows.slice(1);
      
      // Build column definitions
      const columns = headers.map(title => ({ 
        title, 
        type: 'text',
        width: 120  // Set explicit width
      }));
      
      // Initialize jSpreadsheet with enhanced options
      spreadsheet = jspreadsheet(spreadsheetEl, {
        data,
        columns,
        minDimensions: [4, 10], // Minimum grid size
        tableOverflow: true,
        tableHeight: '400px',
        tableWidth: '100%',
        columnDrag: true,
        columnSorting: true,
        
        // Enhanced editing settings
        editable: true,
        allowInsertRow: true,
        allowInsertColumn: true,
        allowDeleteRow: true,
        allowDeleteColumn: true,
        contextMenu: true,
        
        // When cell is clicked (to help with troubleshooting)
        onselection: function(el, cell, x, y, instance) {
          console.log('Cell selected:', x, y, cell);
        },
        
        // When cell content changes
        onchange: function(instance, cell, x, y, value) {
          console.log('Cell changed:', x, y, 'New value:', value);
        },
        
        // Enable keyboard navigation
        allowExport: true,
        
        // Add undo/redo capability
        allowUndo: true
      });
      
      // Connect control buttons
      document.getElementById('add-row-btn').onclick = () => {
        spreadsheet.insertRow();
        showStatus('Row added');
      };
      
      document.getElementById('add-col-btn').onclick = () => {
        spreadsheet.insertColumn();
        showStatus('Column added');
      };
      
      document.getElementById('delete-row-btn').onclick = () => {
        const selectedRow = spreadsheet.getSelectedRows();
        if (selectedRow.length) {
          spreadsheet.deleteRow(selectedRow[0]);
          showStatus('Row deleted');
        } else {
          showStatus('Please select a row first', true);
        }
      };
      
      document.getElementById('delete-col-btn').onclick = () => {
        const selectedCol = spreadsheet.getSelectedColumns();
        if (selectedCol.length) {
          spreadsheet.deleteColumn(selectedCol[0]);
          showStatus('Column deleted');
        } else {
          showStatus('Please select a column first', true);
        }
      };
      
      document.getElementById('save-csv-btn').onclick = () => {
        const csvData = spreadsheet.getCSV();
        downloadCSV(csvData, 'exported_data.csv');
        showStatus('Data exported as CSV');
      };
    }

    // Helper function to properly parse CSV (handling quoted values with commas)
    function parseCSV(text) {
      const result = [];
      const lines = text.split('\n');
      
      lines.forEach(line => {
        if (line.trim() === '') return;
        
        const row = [];
        let cell = '';
        let inQuote = false;
        
        for (let i = 0; i < line.length; i++) {
          const char = line[i];
          
          // Handle quoted content
          if (char === '"') {
            if (i + 1 < line.length && line[i + 1] === '"') {
              // Escaped quote inside quoted field
              cell += '"';
              i++;
            } else {
              // Toggle quote state
              inQuote = !inQuote;
            }
          } else if (char === ',' && !inQuote) {
            // End of cell
            row.push(cell);
            cell = '';
          } else {
            cell += char;
          }
        }
        
        // Add the last cell
        row.push(cell);
        result.push(row);
      });
      
      return result;
    }

    // Helper function to download CSV
    function downloadCSV(data, filename) {
      const blob = new Blob([data], { type: 'text/csv' });
      const url = window.URL.createObjectURL(blob);
      const a = document.createElement('a');
      
      a.setAttribute('hidden', '');
      a.setAttribute('href', url);
      a.setAttribute('download', filename);
      document.body.appendChild(a);
      
      a.click();
      document.body.removeChild(a);
      window.URL.revokeObjectURL(url);
    }
  </script>
</body>
</html>
<!--
  This HTML file provides a simple interface for uploading and handling CSV files using jSpreadsheet.
  It includes drag-and-drop functionality, file selection, and an editable spreadsheet view.
  The script handles file reading, parsing CSV data, and rendering it in a jSpreadsheet instance.
  The spreadsheet allows for row and column manipulation, including insertion and deletion.
  The styles are defined for the drop zone and buttons to enhance user experience.
